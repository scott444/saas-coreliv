# Cache policy by path. Done with a map rather than per-location add_header
# because nginx only inherits add_header into a location that sets none of
# its own - a single add_header in a location would drop the security
# headers below.
map $uri $coreliv_cache_control {
    default    "no-cache, must-revalidate";   # index.html, MSW worker, favicon
    ~^/assets/ "public, max-age=31536000, immutable";  # content-hashed by Vite
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    add_header Cache-Control          $coreliv_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # Container/orchestrator probe. Cheap, no filesystem hit.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A missing hashed asset is a deploy error, not a route - don't hand it
    # the SPA shell and let it fail later as an HTML-parsed-as-JS error.
    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routing: every unknown path renders the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
